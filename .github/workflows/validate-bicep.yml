name: Validate Bicep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build Bicep templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install --version v0.48.1

      - name: Build Bicep
        run: az bicep build --file infra/main.bicep

      - name: Lint Bicep
        run: az bicep lint --file infra/main.bicep